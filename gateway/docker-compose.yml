name: alph-gateway

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:v1.100.1
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    # Admin API/UI (key management) is bound to localhost only.
    # Reach it from your machine with: ssh -L 4000:localhost:4000 <gateway-host>
    ports:
      - "127.0.0.1:4000:4000"
    # Lets *_API_BASE point at a vLLM running on the Docker host (Docker Desktop has this built in; Linux needs it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?set GATEWAY_DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - ./public:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - litellm

  # Fake vLLM for local development without GPUs: docker compose --profile mock up
  mock-vllm:
    profiles: ["mock"]
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-u", "/mock/mock_vllm.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MOCK_API_KEY: ${VLLM_API_KEY:-}
    volumes:
      - ./mock:/mock:ro

volumes:
  pgdata:
  caddy_data:
  caddy_config:
