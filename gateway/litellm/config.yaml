# LiteLLM Proxy config. Docs: https://docs.litellm.ai/docs/proxy/configs
#
# Adding a model = add an entry here, `docker compose restart litellm`, and
# (optionally) add display metadata to public/app/config.json. No app release.
#
# model_name       -> the id the desktop app sees in /v1/models (keep it short and stable)
# litellm_params.model -> "hosted_vllm/<served model name>", i.e. vLLM's --served-model-name
#                    (or the HF repo id if that flag isn't set). Check with: curl <vllm>/v1/models

model_list:
  - model_name: gemma
    litellm_params:
      model: hosted_vllm/gemma           # TODO: replace with the served model name
      api_base: os.environ/GEMMA_API_BASE
      api_key: os.environ/VLLM_API_KEY

  - model_name: qwen
    litellm_params:
      model: hosted_vllm/qwen            # TODO: replace with the served model name
      api_base: os.environ/QWEN_API_BASE
      api_key: os.environ/VLLM_API_KEY

  - model_name: nemotron
    litellm_params:
      model: hosted_vllm/nemotron        # TODO: replace with the served model name
      api_base: os.environ/NEMOTRON_API_BASE
      api_key: os.environ/VLLM_API_KEY
  

litellm_settings:
  # Keep prompts/responses out of logs and callbacks; metadata (user, model, tokens, latency) is kept.
  turn_off_message_logging: true
  # Don't silently drop request fields such as chat_template_kwargs.
  drop_params: false
  request_timeout: 600

router_settings:
  # One attempt per request: retrying a long generation doubles GPU load and latency.
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  store_prompts_in_spend_logs: false
