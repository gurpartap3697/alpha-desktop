[package]
name = "alph-desktop"
version = "0.1.0"
description = "Alph Desktop — chat client for the org's self-hosted models"
edition = "2021"
rust-version = "1.88"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "alph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default TLS = rustls + rustls-platform-verifier, i.e. certificates are checked
# against the OS trust store, so an internal CA installed on the machine works.
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
thiserror = "2"
keyring = "4"
semver = "1"
tauri-plugin-opener = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
